  const SB_KEY = 'sb_publishable_t_cMjfdr6hU1OuSfSrbs0w_aZ8530Ak';
  const NAME_MAX = 10;
  // 名前のNGワード（ひらがな・小文字に直してから部分一致。サーバー側にも同じものがある）
  const NG_WORDS = ['しね', 'ころす', 'ちんこ', 'ちんぽ', 'まんこ', 'せっくす', 'れいぷ', 'きちがい', 'がいじ',
    'fuck', 'shit', 'sex', 'nigger', 'nigga', 'http', 'www'];

  // 点数ごとのコメント（上から順に判定）

    [86, '一番大きいのは自分用でしょ'],

  ];
  const COUNT_COMMENTS = {

    4: 'それ、4等分です', 5: '1人分足りない', 7: '7人目は誰？',
  };
  const PARALLEL_COMMENT = 'ケーキも切れなさそう';
  const PARALLEL_GOOD_COMMENT = '平行切りで六等分、その発想はなかった';  // フリーで平行切りなのに90点以上
  const HANJO_COMMENT = 'はんじょうさん…？';             // フリーで縁の1点から2本
  // フリーモードでピースが8個以上のとき（上から順に判定）
  const MANY_COMMENTS = [
    [100, 'ピザだったもの'],

  ];

  const WHIFF_COMMENT = '包丁がピザに届いてない';
  // 効果音の豪華さ用（0が最上位）

  const $ = id => document.getElementById(id);
  const ui = {
    logo: $('logo'), logoSub: $('logoSub'), turnLabel: $('turnLabel'), hint: $('hint'),
    timer: $('timer'), timerFill: $('timerFill'), restart: $('restart'), mute: $('mute'),
    titlePanel: $('titlePanel'), playPanel: $('playPanel'), resultPanel: $('resultPanel'),
    cutBtn: $('cutBtn'), againBtn: $('againBtn'), shareBtn: $('shareBtn'), toTitle: $('toTitle'),
    scoreNum: $('scoreNum'), comment: $('comment'), stats: $('stats'),
    infoNormal: $('infoNormal'), infoTimed: $('infoTimed'), infoFree: $('infoFree'),
    undoBtn: $('undoBtn'), endBtn: $('endBtn'), guide: $('guide'), home: $('home'),

    rankPeriods: $('rankPeriods'), rankList: $('rankList'), regBtn: $('regBtn'), regDone: $('regDone'),
    modal: $('modal'), modalTitle: $('modalTitle'), modalText: $('modalText'), modalInput: $('modalInput'),
    modalErr: $('modalErr'), modalYes: $('modalYes'), modalNo: $('modalNo'),

  // ---------- 保存（この端末だけ） ----------
  const store = {
    get(k) { try { return localStorage.getItem('pizza6-' + k); } catch (_) { return null; } },
    set(k, v) { try { localStorage.setItem('pizza6-' + k, v); } catch (_) {} },
  };
  const getBest = m => { const v = parseFloat(store.get('best-' + m)); return isNaN(v) ? null : v; };

  // ---------- 幾何 ----------
  function circlePoly(n) {
    const p = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      p.push([Math.cos(a), Math.sin(a)]);
    }
    return p;
  }
  function area(poly) {
    let s = 0;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      s += poly[j][0] * poly[i][1] - poly[i][0] * poly[j][1];
    }
    return Math.abs(s) / 2;
  }
  function centroid(poly) {
    let a = 0, x = 0, y = 0;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const c = poly[j][0] * poly[i][1] - poly[i][0] * poly[j][1];
      a += c; x += (poly[j][0] + poly[i][0]) * c; y += (poly[j][1] + poly[i][1]) * c;
    }
    if (Math.abs(a) < 1e-12) return [0, 0];
    return [x / (3 * a), y / (3 * a)];
  }
  // 凸多角形を直線 n·v = d で2つに分ける
  function split(poly, n, d) {
    const A = [], B = [];
    const len = poly.length;
    for (let i = 0; i < len; i++) {
      const c = poly[i], q = poly[(i + 1) % len];
      const sc = c[0] * n[0] + c[1] * n[1] - d;
      const sq = q[0] * n[0] + q[1] * n[1] - d;
      if (sc >= 0) A.push(c);
      if (sc <= 0) B.push(c);
      if ((sc > 0 && sq < 0) || (sc < 0 && sq > 0)) {
        const t = sc / (sc - sq);
        const p = [c[0] + (q[0] - c[0]) * t, c[1] + (q[1] - c[1]) * t];
        A.push(p); B.push(p);
      }
    }
    return [A, B].filter(p => p.length >= 3 && area(p) > 1e-10);
  }
  const normalOf = th => [-Math.sin(th), Math.cos(th)];
  const dirOf = th => [Math.cos(th), Math.sin(th)];
  const crosses = d => Math.abs(d) < 0.995;

  // ---------- 採点・コメント ----------
  function evaluate(pieces, total) {
    const fr = pieces.map(p => area(p) / total).sort((a, b) => b - a);

    let remain = Infinity;
    if (gameMode === 'timed' && mode === 'play') {
      remain = TURN_MS - (tnow - turnStart);
      const r = Math.max(0, remain / TURN_MS);
      ui.timerFill.style.transform = `scaleX(${r})`;
      ui.timerFill.style.background = remain < 1500 ? '#B3362A' : '#1F1F1F';
      const sec = Math.ceil(remain / 1000);
      if (sec <= 3 && sec >= 1 && sec !== lastTick) { lastTick = sec; sfx.tick(sec === 1); }
      if (remain <= 0) autoCut();
    }

    if (mode === 'play') drawGuide(ctx, view.cx, view.cy, view.R, remain < 1500);
    drawWhiff(now);

    if (mode === 'cutting' && cutAnim) {
      const t = Math.min(1, (now - cutAnim.t0) / CUT_MS);
      const e = 1 - Math.pow(1 - t, 2);
      const [a, b] = chordEnds(cutAnim.line);
      const R = view.R, cx = view.cx, cy = view.cy;
      const ex = a[0] + (b[0] - a[0]) * e, ey = a[1] + (b[1] - a[1]) * e;
      // 刃の軌跡：先端の手前に、すっと消える光の帯
      const e0 = Math.max(0, e - 0.28);
      const sx = a[0] + (b[0] - a[0]) * e0, sy = a[1] + (b[1] - a[1]) * e0;
      ctx.save();
      ctx.lineCap = 'round';
      const gr = ctx.createLinearGradient(cx + sx * R, cy + sy * R, cx + ex * R, cy + ey * R);
      gr.addColorStop(0, 'rgba(255,255,255,0)');
      gr.addColorStop(1, 'rgba(255,255,255,.85)');
      ctx.strokeStyle = gr; ctx.lineWidth = 9;
      ctx.beginPath(); ctx.moveTo(cx + sx * R, cy + sy * R); ctx.lineTo(cx + ex * R, cy + ey * R); ctx.stroke();
      ctx.strokeStyle = '#1F1F1F'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(cx + a[0] * R, cy + a[1] * R); ctx.lineTo(cx + ex * R, cy + ey * R); ctx.stroke();
      ctx.fillStyle = '#1F1F1F';
      ctx.beginPath(); ctx.arc(cx + ex * R, cy + ey * R, 4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      if (t >= 1) finishCut();
    }

    // 結果の点数をカウントアップ
    if (scoreAnim) {
      const t = Math.min(1, Math.max(0, (now - scoreAnim.t0) / 750));
      const e = 1 - Math.pow(1 - t, 3);
      ui.scoreNum.innerHTML = scoreHTML(scoreAnim.to * e);
      if (t >= 1) scoreAnim = null;
    }
    requestAnimationFrame(frame);
  }
  function scoreHTML(v) {
    const s = v.toFixed(2);
    const i = s.indexOf('.');
    return `${s.slice(0, i)}<span class="dec">${s.slice(i)}</span>`;
  }

  // ---------- 操作 ----------
  const ptrs = new Map();
  const toN = (x, y) => [(x - view.cx) / view.R, (y - view.cy) / view.R];
  const wrapAngle = a => Math.atan2(Math.sin(a), Math.cos(a));
  const clampD = d => Math.max(-MAX_D, Math.min(MAX_D, d));

  // 線上の点を m0 まわりに dth 回して、m0→m1 の分だけ動かす
  function rigid(m0, m1, dth) {
    const n = normalOf(line.th);
    const p = [view.cx + n[0] * line.d * view.R, view.cy + n[1] * line.d * view.R];
    const rx = p[0] - m0[0], ry = p[1] - m0[1];
    const c = Math.cos(dth), s = Math.sin(dth);
    const p2 = [m0[0] + rx * c - ry * s + (m1[0] - m0[0]), m0[1] + rx * s + ry * c + (m1[1] - m0[1])];
    line.th = wrapAngle(line.th + dth);
    const q = toN(p2[0], p2[1]);
    const n2 = normalOf(line.th);
    line.d = clampD(q[0] * n2[0] + q[1] * n2[1]);
  }
  function applyMove(id, nx, ny) {
    const prev = ptrs.get(id);
    if (!prev) return;
    if (ptrs.size >= 2) {
      let o = null;
      for (const [k, v] of ptrs) if (k !== id) { o = v; break; }
      const m0 = [(prev.x + o.x) / 2, (prev.y + o.y) / 2];
      const m1 = [(nx + o.x) / 2, (ny + o.y) / 2];
      const a0 = Math.atan2(prev.y - o.y, prev.x - o.x);
      const a1 = Math.atan2(ny - o.y, nx - o.x);
      rigid(m0, m1, wrapAngle(a1 - a0));
    } else {
      const n = normalOf(line.th);
      const dd = ((nx - prev.x) * n[0] + (ny - prev.y) * n[1]) / view.R;
      line.d = clampD(line.d + dd);
    }
    prev.x = nx; prev.y = ny;
    updateCutBtn();
  }

  cv.addEventListener('pointerdown', e => {
    if (mode !== 'play') return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    hideGuide();
  });
  cv.addEventListener('pointermove', e => {
    if (mode !== 'play' || !ptrs.has(e.pointerId)) return;
    e.preventDefault();
    applyMove(e.pointerId, e.clientX, e.clientY);
  });
  cv.addEventListener('wheel', e => {
    if (mode !== 'play') return;
    e.preventDefault();
    hideGuide();
    const dy = Math.max(-60, Math.min(60, e.deltaY));
    // カーソルから線に下ろした足を軸に回す
    const n = normalOf(line.th);
    const dist = (e.clientX - view.cx) * n[0] + (e.clientY - view.cy) * n[1] - line.d * view.R;
    const m = [e.clientX - n[0] * dist, e.clientY - n[1] * dist];
    rigid(m, m, dy * 0.0025);
    updateCutBtn();
  }, { passive: false });
  const up = e => { ptrs.delete(e.pointerId); };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('lostpointercapture', up);
  document.addEventListener('touchmove', e => {
    if (!(e.target.closest && e.target.closest('#rankList'))) e.preventDefault();
  }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());

  function updateCutBtn() {
    const capped = gameMode === 'free' && cuts && cuts.length >= MAX_CUTS;
    ui.cutBtn.disabled = !(mode === 'play' && crosses(line.d) && !capped);
    ui.undoBtn.disabled = !(mode === 'play' && cuts && cuts.length > 0);
    ui.endBtn.disabled = !(mode === 'play' && cuts && cuts.length > 0);
  }

  // ---------- 進行 ----------
  function setMode(m) {
    mode = m;
    const isTitle = m === 'title', isPlay = isPlayLike(), isResult = m === 'result';
    ui.logo.classList.toggle('hidden', !isTitle);
    ui.logoSub.classList.toggle('hidden', !isTitle);
    ui.titlePanel.classList.toggle('hidden', !isTitle);
    ui.turnLabel.classList.toggle('hidden', isTitle);
    ui.hint.classList.toggle('hidden', !isPlay);

  }
  function renderTitleInfo() {

      const b = getBest(m);

  // ---------- 初回だけの操作ガイド ----------
  let guideOn = false;
  function maybeShowGuide() {

  // 操作したら消して、次からは出さない（force: 画面が変わったので消すだけ）
  function hideGuide(force) {

  function later(fn, ms) { const id = gameId; setTimeout(() => { if (id === gameId) fn(); }, ms); }
  function startGame(m) {
    if (m) gameMode = m;
    gameId++;
    paused = false;
    ensureAudio();
    sfx.tap();
    // 毎回、模様・位置・大きさ・背景の柄をランダムに
    pizzaSeed = (Math.random() * 1e9) | 0;
    renderPizza(Math.min(W, H) * 0.5 * dpr);
    jitter = { x: (Math.random() * 2 - 1) * 0.06, y: (Math.random() * 2 - 1) * 0.04, s: 0.9 + Math.random() * 0.1 };
    const cell = Math.round(bgCell * dpr);
    bgOff = [Math.random() * cell * 2, Math.random() * cell * 2];
    resetGame();
    ptrs.clear();
    splitAnim = null; scoreAnim = null;
    ui.timerFill.style.transform = 'scaleX(1)';

  }
  function beginTurn() {
    if (mode === 'countdown') startTime = performance.now();
    turnStart = performance.now();
    lastTick = 0;
    setMode('play');
  }

  const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (_) {} };
  function doCut() {
    if (mode !== 'play' || !crosses(line.d)) return;
    if (gameMode === 'free' && cuts.length >= MAX_CUTS) return;
    cutAnim = { line: { ...line }, t0: performance.now() };
    ptrs.clear();
    vibrate(8);
    sfx.cut();
    setMode('cutting');
  }
  function autoCut() {
    if (mode !== 'play') return;
    if (crosses(line.d)) { doCut(); return; }
    // 線がピザに届いていない → 空振り（1回分を消費）
    whiffs++;
    whiffAt = performance.now();
    ptrs.clear();
    sfx.whiff();
    mode = 'wait';
    ui.cutBtn.disabled = true;
    later(afterTurn, 650);
  }
  function finishCut() {
    const ln = cutAnim.line;
    cutAnim = null;
    history.push(pieces);
    const n = normalOf(ln.th);
    const next = [];
    for (const p of pieces) next.push(...split(p, n, ln.d));
    pieces = next;
    cuts.push(ln);
    // 刃が抜けた瞬間：切り口がわずかに開いて戻る＋短い振動
    splitAnim = { n, d: ln.d, t0: performance.now() };
    vibrate(18);
    afterTurn();
  }
  function afterTurn() {
    if (gameMode === 'free') { resetLine(); beginTurn(); return; }
    if (turn >= 3) {
      endTime = performance.now();
      mode = 'wait';
      ui.cutBtn.disabled = true;
      later(showResult, 350);
      return;
    }
    turn++;
    resetLine();
    beginTurn();
  }

  function showResult() {
    result = evaluate(pieces, TOTAL);
    const comment = commentFor(result, cuts, whiffs, gameMode);
    const sec = (endTime - startTime) / 1000;
    const prevBest = getBest(gameMode);
    const prevCuts = parseInt(store.get('bestcuts-' + gameMode) || '999', 10);
    const prevTime = parseFloat(store.get('besttime-' + gameMode) || 'Infinity');
    // 同点なら、フリーは切った回数が少ない方、じっくり・せっかちは時間が短い方を上に
    const tieWin = gameMode === 'free' ? cuts.length < prevCuts : sec < prevTime;
    const isBest = prevBest === null || result.score > prevBest || (result.score === prevBest && tieWin);
    if (isBest) {
      store.set('best-' + gameMode, String(result.score));
      store.set('bestcuts-' + gameMode, String(cuts.length));
      store.set('besttime-' + gameMode, String(sec));
    }

    lastPlay = {
      mode: gameMode, lines: cuts.map(c => [c.th, c.d]), whiffs, timeMs: Math.round(sec * 1000),
      score: result.score, registered: false,
    };
    ui.regBtn.classList.remove('hidden');
    ui.regDone.classList.add('hidden');
    ui.scoreNum.innerHTML = scoreHTML(0);
    ui.comment.textContent = comment;
    const spread = result.count > 1 ? [`最大と最小の差 ${result.spread.toFixed(1)}%`] : [];
    const parts = gameMode === 'free'
      ? [`${cuts.length}回で切った`, `ピース ${result.count}個`, ...spread]
      : [`ピース ${result.count}個`, ...spread, `${sec.toFixed(1)}秒`];
    let bestLine = '';
    if (isBest && prevBest !== null) {
      const diff = result.score - prevBest;
      bestLine = `<br><span class="best">自己ベスト更新${diff > 0 ? `（+${diff.toFixed(2)}）` : ''}</span>`;
    }
    ui.stats.innerHTML = parts.join('　・　') + bestLine;
    const modeLabel = gameMode === 'free' ? `フリー・${cuts.length}回` : MODES[gameMode].name;
    shareText = `🍕 ピザ六等分（${modeLabel}）${result.score.toFixed(2)}点\n「${comment}」\n#ピザ六等分\n${GAME_URL}`;
    shareFile = null;
    makeShareImage(result, comment, modeLabel);

    setMode('result');
    explodeStart = performance.now();
    sfx.split();
    const tier = SOUND_TIERS.findIndex(t => result.score >= t);
    setTimeout(() => sfx.score(tier), 520);
    if (isBest && prevBest !== null) setTimeout(() => sfx.best(), 1250);
    setTimeout(() => ui.resultPanel.classList.add('show'), 450);
    scoreAnim = { to: result.score, t0: performance.now() + 450 };
  }

  // ---------- ポップアップ ----------
  // opts: { title, text, input(初期値。null なら入力欄なし), yes, no, onYes(値) → false なら閉じない, onNo }
  let modalOpts = null, modalBusy = false;

  // ---------- プレイ中にタイトルへ ----------
  function pause() { if (!paused) { paused = true; pauseAt = performance.now(); ptrs.clear(); } }
  function resume() {
    if (!paused) return;

    paused = false;
    countdownStart += delta;
    startTime += delta;
    // 止めている間に次のターンが始まっていたら、そこから計り直す

  function askToTitle() {

  // ---------- ランキング ----------
  const rank = { mode: 'normal', period: 'today', myId: null, seq: 0 };
  // 名前を整える（全角英数→半角、制御文字を除く、空白をまとめる）
  function cleanName(s) {
    return s.normalize('NFKC').replace(/[\u0000-\u001f\u007f\u200b-\u200f\u2028-\u202e\u2060-\u206f\ufeff]/g, '')
      .replace(/\s+/g, ' ').trim();
  }
  function nameError(n) {
    const len = [...n].length;
    if (!len) return '名前を入れてください';
    if (len > NAME_MAX) return `${NAME_MAX}文字までにしてください`;
    const k = n.toLowerCase().replace(/[\s._\-・]/g, '')
      .replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
    if (NG_WORDS.some(w => k.includes(w))) return 'その名前は使えません';
    return '';
  }
  // ブラウザごとのランダムなID（ランキングを「ひとり1件」にするため）。外からは見えない
  function playerId() {
    let id = store.get('pid');
    if (!id || !/^[0-9a-f-]{36}$/i.test(id)) {
      id = (crypto.randomUUID && crypto.randomUUID()) ||
        '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, c =>
          (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & 15) >> (c / 4)).toString(16));
      store.set('pid', id);
    }
    return id;
  }
  // 日本時間の今日0時（UTC の ISO 文字列）
  function jstDayStartISO() {
    const d = new Date(Date.now() + 9 * 3600e3);
    d.setUTCHours(0, 0, 0, 0);
    return new Date(d.getTime() - 9 * 3600e3).toISOString();
  }
  function openRank(m, period) {
    rank.mode = m; rank.period = period;
    ui.rankPanel.classList.remove('hidden');
    ui.rankList.scrollTop = 0;

  function closeRank() {

  function rankMsg(t) { ui.rankList.innerHTML = ''; const d = document.createElement('div'); d.id = 'rankMsg'; d.textContent = t; ui.rankList.appendChild(d); }
  async function loadRank() {
    for (const b of ui.rankModes.children) b.classList.toggle('on', b.dataset.v === rank.mode);
    for (const b of ui.rankPeriods.children) b.classList.toggle('on', b.dataset.v === rank.period);

    let q = `${SB_URL}/rest/v1/scores?select=id,name,score,cuts,time_ms&mode=eq.${m}&order=${order}&limit=100`;
    if (rank.period === 'today') q += '&created_at=gte.' + encodeURIComponent(jstDayStartISO());

      el.append(rk, nm, sc, sub);
      ui.rankList.appendChild(el);
    });
  }
  function askRegister() {
    if (!lastPlay || lastPlay.registered) return;
    sfx.tap();
    const lp = lastPlay;
    showModal({
      title: 'ランキングに登録',
      text: `${MODES[lp.mode].name}　${lp.score.toFixed(2)}点\n残るのは自己ベストの1件だけです\n名前は${NAME_MAX}文字まで`,
      input: store.get('name') || '',
      yes: '登録', no: 'やめる',

        let res;

            method: 'POST',
            headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },

          });
          res = await r.json().catch(() => ({}));
          if (!r.ok) { ui.modalErr.textContent = res.error || '登録できませんでした'; return false; }
        } catch (_) {
          ui.modalErr.textContent = '通信できませんでした。時間をおいて試してください';

      },
    });
  }
  function showRegistered(res) {
    ui.regBtn.classList.add('hidden');
    ui.regDone.classList.remove('hidden');
    const ranks = res.rankToday ? `歴代 ${res.rankAll}位・今日 ${res.rankToday}位` : `歴代 ${res.rankAll}位`;
    if (res.updated === false) {
      // 自己ベストではない：記録はそのまま（名前だけ更新）
      ui.regDone.textContent = res.pending
        ? `自己ベスト（${Number(res.best).toFixed(2)}点）ではないため更新されません`
        : `自己ベストではないため更新されません\n現在 ${ranks}`;
    } else {
      ui.regDone.textContent = res.pending ? '登録しました（確認後に表示されます）' : `登録しました　${ranks}`;
    }
    const b = document.createElement('button');
    b.textContent = '見る';
    b.addEventListener('click', () => { sfx.tap(); openRank(lastPlay.mode, 'today'); });
    ui.regDone.appendChild(b);
  }

  // ---------- シェア ----------
  // 結果の画像（1080×1080）。ロゴとURLを小さく入れる
  function makeShareImage(res, comment, modeLabel) {
    try {
      const S = 1080;
      const c = document.createElement('canvas');
      c.width = c.height = S;
      const g = c.getContext('2d');
      g.fillStyle = '#FAF7F2'; g.fillRect(0, 0, S, S);
      g.fillStyle = 'rgba(205,185,155,.16)';
      for (let i = 0; i < S; i += 64) { g.fillRect(i, 0, 32, S); g.fillRect(0, i, S, 32); }
      const font = w => `${w} -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif`;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = '#8A847C'; g.font = font('600 34px');
      g.fillText(modeLabel, S / 2, 78);
      drawPizzaPieces(g, S / 2, 440, 290, 1, true, null);
      const s = res.score.toFixed(2), dot = s.indexOf('.');
      const big = s.slice(0, dot), small = s.slice(dot) + '点';
      g.fillStyle = '#1F1F1F';
      g.font = font('800 120px'); const wb = g.measureText(big).width;
      g.font = font('700 64px'); const ws = g.measureText(small).width;
      const x0 = S / 2 - (wb + ws) / 2;
      g.textAlign = 'left'; g.textBaseline = 'alphabetic';
      g.font = font('800 120px'); g.fillText(big, x0, 880);
      g.font = font('700 64px'); g.fillText(small, x0 + wb, 880);
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = font('700 44px');
      g.fillText(`「${comment}」`, S / 2, 950, S - 120);
      g.fillStyle = '#8A847C'; g.font = font('600 26px');
      g.fillText('ピザ六等分　cazami.github.io/pizza6', S / 2, 1035);
      c.toBlob(b => {
        if (!b || mode !== 'result') return;
        try { shareFile = new File([b], 'pizza6.png', { type: 'image/png' }); } catch (_) {}
      }, 'image/png');
    } catch (_) {}
  }
  async function share() {
    sfx.tap();
    if (USE_SHARE_SHEET) {
      const data = { text: shareText };
      if (shareFile && navigator.canShare && navigator.canShare({ files: [shareFile], text: shareText })) data.files = [shareFile];
      try { await navigator.share(data); return; }
      catch (e) {
        if (e && e.name === 'AbortError') return;   // 共有シートを閉じただけ
        if (data.files) { try { await navigator.share({ text: shareText }); return; } catch (e2) { if (e2 && e2.name === 'AbortError') return; } }
      }
    }
    window.open('https://x.com/intent/post?text=' + encodeURIComponent(shareText), '_blank', 'noopener');
  }

  function undo() {
    if (mode !== 'play' || gameMode !== 'free' || !cuts.length) return;
    pieces = history.pop();
    cuts.pop();
    sfx.tap();
    resetLine();
    setMode('play');
  }
  function endFree() {
    if (mode !== 'play' || gameMode !== 'free' || !cuts.length) return;
    endTime = performance.now();
    mode = 'wait';
    updateCutBtn();
    sfx.tap();
    later(showResult, 200);
  }

  function toTitle() {
    gameId++;
    paused = false;
    sfx.tap();
    resetGame();
    jitter = { x: 0, y: 0, s: 1 };
    setMode('title');
  }

  document.querySelectorAll('.modeBtn').forEach(b => b.addEventListener('click', () => startGame(b.dataset.mode)));
  ui.cutBtn.addEventListener('click', doCut);
  ui.undoBtn.addEventListener('click', undo);
  ui.endBtn.addEventListener('click', endFree);
  ui.againBtn.addEventListener('click', () => startGame());
  ui.restart.addEventListener('click', () => startGame());
  ui.toTitle.addEventListener('click', toTitle);
  ui.shareBtn.addEventListener('click', share);
  ui.home.addEventListener('click', askToTitle);
  ui.rankOpen.addEventListener('click', () => { sfx.tap(); openRank('normal', 'today'); });
  ui.rankClose.addEventListener('click', closeRank);
  ui.regBtn.addEventListener('click', askRegister);
  for (const [box, key] of [[ui.rankModes, 'mode'], [ui.rankPeriods, 'period']]) {
    box.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b || rank[key] === b.dataset.v) return;
      rank[key] = b.dataset.v;
      loadRank();
    });
  }
  if (USE_SHARE_SHEET) ui.shareBtn.textContent = 'シェア';
  ui.mute.addEventListener('click', () => {
    muted = !muted;
    store.set('muted', muted ? '1' : '0');
    renderMute();
    if (!muted) { ensureAudio(); sfx.tap(); }
  });
  if (IS_MOUSE) ui.hint.textContent = 'ドラッグで動かす　ホイールで回す';
  renderMute();

  // 検証用
  window.__pizza = {
    get state() { return { mode, gameMode, turn, line, pieces, cuts, whiffs, jitter, view: { ...target } }; },
    setLine(th, d) { line.th = th; line.d = d; updateCutBtn(); },
    commentFor, evaluate, isHanjo, SCORE_COMMENTS,
    get shareText() { return shareText; },
    get shareFile() { return shareFile; },
  };

  resetGame();
  resize();
  setMode('title');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
